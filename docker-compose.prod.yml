services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-scoutline}
    volumes:
      - scoutline_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    env_file: ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    expose: ["8000"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.prod
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-80}:80"
    restart: unless-stopped

  prometheus:
    build: ./infra/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    build: ./infra/grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in the host environment}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.2
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
    expose: ["9100"]
    restart: unless-stopped

  jenkins:
    build: ./infra/jenkins
    user: root
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      # Local mode: the repo and generated env files are mounted read-only so
      # the pipeline needs no external Git remote or Jenkins credentials.
      - ${LOCAL_REPO_DIR:-.}:/repo:ro
      - ./.env:/local-config/compose.env:ro
      - ./backend/.env:/local-config/backend.env:ro
    environment:
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:-change-me}
      JENKINS_PORT: ${JENKINS_PORT:-8080}
      LOCAL_BRANCH: ${LOCAL_BRANCH:-main}
      LOCAL_DEPLOY: ${LOCAL_DEPLOY:-false}
    ports:
      - "127.0.0.1:${JENKINS_PORT:-8080}:8080"
      - "127.0.0.1:${JENKINS_AGENT_PORT:-50000}:50000"
    profiles: ["ci"]
    restart: unless-stopped

volumes:
  scoutline_pgdata:
  prometheus_data:
  grafana_data:
  jenkins_home:
